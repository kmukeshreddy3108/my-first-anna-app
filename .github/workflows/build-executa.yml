name: Build Executa Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Executa version tag (e.g., 0.2.0)'
        required: true
        default: '0.2.0'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            archive_format: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            archive_format: zip
          - platform: darwin-arm64
            os: macos-14
            archive_format: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Executa Binary (PyInstaller)
        shell: bash
        working-directory: executas/my-first-anna-app
        run: |
          uv pip install --system pyinstaller .
          pyinstaller --onedir --name my-first-anna-app-summarizer my_first_anna_app_plugin.py

      - name: Package Artifact (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        working-directory: executas/my-first-anna-app/dist
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ARCHIVE_NAME="my-first-anna-app-summarizer-${VERSION}-${{ matrix.platform }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" my-first-anna-app-summarizer
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Package Artifact (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        working-directory: executas/my-first-anna-app/dist
        run: |
          $Version = "${{ github.event.inputs.version }}"
          $ArchiveName = "my-first-anna-app-summarizer-$Version-${{ matrix.platform }}.zip"
          Compress-Archive -Path "my-first-anna-app-summarizer" -DestinationPath "$ArchiveName"
          (Get-FileHash -Path "$ArchiveName" -Algorithm SHA256).Hash.ToLower() | Out-File "${{ matrix.platform }}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.platform }}
          path: executas/my-first-anna-app/dist/*

  release:
    needs: build
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Executa Release v${{ github.event.inputs.version }}
          files: all-artifacts/executa-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
