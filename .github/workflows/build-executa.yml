name: Build Executa Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Executa version tag (e.g., 0.3.0)'
        required: true
        default: '0.3.0'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            archive_format: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            archive_format: zip
          - platform: darwin-arm64
            os: macos-15
            archive_format: tar.gz
          - platform: darwin-x86_64
            os: macos-15-intel
            archive_format: tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Executa Binary (PyInstaller)
        shell: bash
        working-directory: executas/studylens-ai
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller .
          pyinstaller --onedir --clean --name studylens-ai studylens_ai_plugin.py
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --force --deep --sign - dist/studylens-ai
          fi

      - name: Package Artifact (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        working-directory: executas/studylens-ai/dist
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ARCHIVE_NAME="studylens-ai-${VERSION}-${{ matrix.platform }}.tar.gz"
          chmod +x studylens-ai/studylens-ai
          tar -czf "$ARCHIVE_NAME" studylens-ai
          if command -v sha256sum &> /dev/null; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Package Artifact (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        working-directory: executas/studylens-ai/dist
        run: |
          $Version = "${{ github.event.inputs.version }}"
          $ArchiveName = "studylens-ai-$Version-${{ matrix.platform }}.zip"
          Compress-Archive -Path "studylens-ai" -DestinationPath "$ArchiveName"
          $hash = (Get-FileHash -Path "$ArchiveName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $ArchiveName" | Out-File -Encoding ascii "$ArchiveName.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.platform }}
          path: executas/studylens-ai/dist/*

  release:
    needs: build
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Executa Release v${{ github.event.inputs.version }}
          files: all-artifacts/executa-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
