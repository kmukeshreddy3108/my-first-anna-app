name: Build Executa binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.2.0"
        type: string

permissions:
  contents: write

env:
  EXECUTA_NAME: my-first-anna-app-summarizer
  SOURCE_FILE: executas/my-first-anna-app/my_first_anna_app_plugin.py

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: windows-x86_64
            runner: windows-latest
          - platform: darwin-x86_64
            runner: macos-13
          - platform: darwin-arm64
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Create build environment
        run: uv venv --python 3.11 .venv

      - name: Install PyInstaller
        run: uv pip install --python .venv pyinstaller

      - name: Build executable
        run: >
          uv run --python .venv pyinstaller
          --noconfirm
          --clean
          --onedir
          --name ${{ env.EXECUTA_NAME }}
          --distpath build/dist
          --workpath build/work
          --specpath build/spec
          ${{ env.SOURCE_FILE }}

      - name: Archive Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${EXECUTA_NAME}-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" \
            -C build/dist "${EXECUTA_NAME}"

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "build/dist/$env:EXECUTA_NAME" `
            -DestinationPath "dist/$env:EXECUTA_NAME-${{ inputs.version }}-${{ matrix.platform }}.zip" `
            -Force

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          artifact="dist/${EXECUTA_NAME}-${{ inputs.version }}-${{ matrix.platform }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            artifact="${artifact}.zip"
          else
            artifact="${artifact}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact" > "${artifact}.sha256"
          else
            shasum -a 256 "$artifact" > "${artifact}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
