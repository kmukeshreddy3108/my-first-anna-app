<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StudyLens AI turns your documents into a grounded learning kit.">
  <title>StudyLens AI</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f4f7fb;line-height:1.5}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}
    button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;background:#2563eb;color:#fff;font-weight:700}
    button.secondary{background:#e8eef8;color:#19345f}button.ghost{background:transparent;color:#2563eb}
    button:disabled{opacity:.55;cursor:not-allowed}a{color:#2563eb;text-decoration:none}
    .shell{max-width:1120px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px}.brand h1{font-size:23px;margin:0}.tagline{margin:0;color:#66758a;font-size:13px}
    nav{display:flex;gap:5px;flex-wrap:wrap}nav button{background:transparent;color:#52606d;padding:8px 11px}nav button.active{background:#dbeafe;color:#1d4ed8}
    .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;align-items:stretch}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:22px;box-shadow:0 5px 20px #1720330b;margin-bottom:16px}
    h2{margin:0 0 8px;font-size:21px}h3{margin:18px 0 8px;font-size:16px}p{color:#52606d}.muted{color:#66758a;font-size:13px}.eyebrow{color:#2563eb;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
    textarea{width:100%;min-height:260px;padding:14px;border:1px solid #b9c5d6;border-radius:10px;resize:vertical;color:#172033}.input-meta{display:flex;justify-content:space-between;margin-top:6px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dropzone{border:2px dashed #b9c5d6;border-radius:10px;padding:17px;text-align:center;margin-top:14px;background:#f8fafc}.dropzone.drag{border-color:#2563eb;background:#eff6ff}
    .notice{padding:11px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px}.error{padding:11px;border-radius:9px;background:#fff0ee;color:#b42318;border:1px solid #f1b8b0}
    .progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.step{padding:10px;border-radius:9px;background:#edf2f8;color:#6b7890;text-align:center;font-size:13px}.step.active{background:#dbeafe;color:#1d4ed8}.step.done{background:#dcfce7;color:#166534}.step.failed{background:#fee2e2;color:#991b1b}
    .tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #dbe3ee;margin-bottom:17px}.tab{background:transparent;color:#52606d;border-radius:8px 8px 0 0}.tab.active{background:#2563eb;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item,.history-item,.chat-message{padding:14px;border:1px solid #e1e8f1;border-radius:11px;background:#fbfcfe;margin-bottom:9px}.item p{margin:5px 0}.citation{font-size:12px;color:#52606d;border-left:3px solid #93c5fd;padding-left:9px;margin-top:8px}.citation summary{cursor:pointer;color:#1d4ed8;font-weight:700}.citation div{padding-top:6px}.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800;background:#dcfce7;color:#166534}.badge.basic{background:#fef3c7;color:#92400e}
    .history-item{display:flex;justify-content:space-between;gap:12px;align-items:center}.history-item small{display:block;color:#66758a}.empty{text-align:center;padding:30px;color:#66758a}
    .file-list{display:grid;gap:8px;margin-top:12px}.file-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px;border:1px solid #e1e8f1;border-radius:10px;background:#fbfcfe}.file-item strong{margin-right:8px}
    .settings-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6ebf2;padding:14px 0}.settings-row:last-child{border:0}.status-badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800}.status-badge.connected{background:#dcfce7;color:#166534}.status-badge.reconnecting{background:#fef3c7;color:#92400e}
    @media(max-width:760px){.shell{padding:14px}.topbar,.hero{display:block}.topbar nav{margin-top:14px}.grid{grid-template-columns:1fr}.progress{grid-template-columns:1fr 1fr}}
  </style>
  <script src="anna-tool-ids.js" defer></script>
  <script src="./app.js" type="module"></script>
</head>
<body><main class="shell">
  <header class="topbar"><a class="brand" href="#/"><img class="logo" src="./logo.svg" alt="StudyLens AI logo"><span><strong class="brand h1">StudyLens AI</strong><span class="tagline">Grounded learning from your documents</span></span></a><span id="connection-status" class="status-badge reconnecting">Reconnecting</span>
    <nav aria-label="Primary navigation"><button data-route="/" type="button">New analysis</button><button data-route="/history" type="button">History</button><button data-route="/settings" type="button">Settings</button></nav>
  </header>
  <div id="app" aria-live="polite"></div>
</main></body>
</html>
