[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studylens-ai"
version = "0.3.0"
description = "AI Study & Document Analyst Executa for StudyLens AI"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
"studylens-ai" = "studylens_ai_plugin:main"

[tool.setuptools]
py-modules = ["studylens_ai_plugin"]

[tool.pytest.ini_options]
pythonpath = ["."]
